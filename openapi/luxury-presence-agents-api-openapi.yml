openapi: 3.0.0
info:
  title: API Documentation Agents API
  description: Luxury Presence API Documentation.
  version: '1.0'
  contact: {}
servers:
- url: https://api.luxurypresence.com
  description: Production API server
security:
- ApiKeyAuth: []
tags:
- name: Agents
paths:
  /cms/v1/agents:
    get:
      operationId: AgentsController_handleGetAgents
      parameters:
      - name: offset
        required: false
        in: query
        description: The number of items to skip
        schema:
          type: number
      - name: limit
        required: false
        in: query
        description: The number of items to fetch
        schema:
          type: number
      - name: tags
        required: false
        in: query
        description: Filter agents by tags
        schema:
          type: array
          items:
            type: string
      - name: tagsMode
        required: false
        in: query
        description: Mode to use for tags filters (default is ANY)
        schema:
          enum:
          - ANY
          - ALL
          - NOT
          - NOT_ALL
          type: string
      - name: externalSource
        required: false
        in: query
        description: Filter agents by external source
        schema:
          type: string
      - name: externalIds
        required: false
        in: query
        description: Filter agents by external IDs
        schema:
          type: array
          items:
            type: string
      - name: search
        required: false
        in: query
        description: Search agents by name or email
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentsResponseDto'
              example:
                count: 1
                items:
                - agentId: 1b87e039-6d6d-4bda-ba32-259ded3c3f92
                  firstName: Desiree
                  lastName: Marks
                  email: null
                  displayOrder: 22
                  phoneNumber: null
                  secondaryNumber: null
